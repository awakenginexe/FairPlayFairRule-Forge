org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod Properties
mod_id=fairplayfairrule
mod_name=FairPlayFairRule
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.fairplayfairrule
mod_authors=Awake Ngine XE
